<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Video Room</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/webrtc-adapter/6.4.0/adapter.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/1.9.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.blockUI/2.70/jquery.blockUI.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/spin.js/2.3.2/spin.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/3.4.1/js/bootstrap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/2.1.4/toastr.min.js"></script>

    <script src="./janus.js"></script>
    <script src="./videoroomtest.js"></script>

    <link rel="stylesheet" href="./videoroom.css" />
  </head>

  <body>
    <div class="app-container">
      <nav class="top-nav">
        <div class="room-tag">
          <span class="dot pulse"></span>
          ROOM: <span id="room">---</span>
        </div>
        <div class="logo">VIDEO ROOM</div>
      </nav>

      <div id="videojoin" class="setup-workspace">
        <div id="videolocal-setup" class="video-box active"></div>
      </div>

      <main id="videos" class="video-workspace hide">
        <div class="video-box active">
          <div id="videolocal" class="stream-container"></div>
          <div class="overlay-info">
            <span class="badge local">ME</span>
            <span id="publisher" class="status-text hide">Live</span>
          </div>
        </div>
        <div class="video-box">
          <div id="videoremote1" class="stream-container"></div>
          <div class="overlay-info">
            <span class="badge remote">REMOTE</span>
            <span id="remote1" class="status-text hide"></span>
          </div>
        </div>

        <div class="video-box">
          <div id="videoremote2" class="stream-container"></div>
          <div class="overlay-info">
            <span class="badge remote">REMOTE</span>
            <span id="remote2" class="status-text hide"></span>
          </div>
        </div>

        <div class="video-box">
          <div id="videoremote3" class="stream-container"></div>
          <div class="overlay-info">
            <span class="badge remote">REMOTE</span>
            <span id="remote3" class="status-text hide"></span>
          </div>
        </div>

        <div class="video-box">
          <div id="videoremote4" class="stream-container"></div>
          <div class="overlay-info">
            <span class="badge remote">REMOTE</span>
            <span id="remote4" class="status-text hide"></span>
          </div>
        </div>

        <div class="video-box">
          <div id="videoremote5" class="stream-container"></div>
          <div class="overlay-info">
            <span class="badge remote">REMOTE</span>
            <span id="remote5" class="status-text hide"></span>
          </div>
        </div>
      </main>
    </div>
  </body>
</html>
